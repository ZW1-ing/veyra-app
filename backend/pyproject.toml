[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "migrations/versions"]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "SIM"]
ignore = [
    # FastAPI 的依赖注入本来就写成参数默认值，这是框架惯用法，不是 bug
    "B008",
    # 中文注释和文档字符串里换行位置由内容决定
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# 测试里故意用长断言行，可读性优先
"tests/*" = ["E501"]
